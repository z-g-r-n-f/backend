name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        shell: powershell
        run: |
          .\mvnw.cmd -B clean package -DskipTests

      - name: Stop old Spring Boot
        shell: powershell
        run: |
          $connections = Get-NetTCPConnection `
            -LocalPort 8080 `
            -State Listen `
            -ErrorAction SilentlyContinue

          foreach ($connection in $connections) {
            $processId = $connection.OwningProcess

            if ($processId -and $processId -ne 0) {
              Write-Host "Stopping process PID: $processId"
              Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
            }
          }

          Start-Sleep -Seconds 2

      - name: Deploy JAR
        shell: powershell
        run: |
          $deployDir = "E:\work\backend\device-lifecycle-deploy"

          if (-not (Test-Path $deployDir)) {
            New-Item -ItemType Directory -Path $deployDir -Force
          }

          $jar = Get-ChildItem "target\*.jar" |
            Where-Object {
              $_.Name -notlike "*-plain.jar"
            } |
            Select-Object -First 1

          if (-not $jar) {
            Write-Error "JAR file not found."
            exit 1
          }

          Copy-Item `
            $jar.FullName `
            "$deployDir\app.jar" `
            -Force

          Write-Host "Deployed: $($jar.Name)"

      - name: Start Spring Boot
        shell: powershell
        run: |
          $deployDir = "E:\work\backend\device-lifecycle-deploy"

          Start-Process `
            -FilePath "java" `
            -ArgumentList "-jar", "app.jar" `
            -WorkingDirectory $deployDir `
            -RedirectStandardOutput "$deployDir\app.log" `
            -RedirectStandardError "$deployDir\app-error.log"

          Start-Sleep -Seconds 10

          $connection = Test-NetConnection `
            -ComputerName "localhost" `
            -Port 8080 `
            -WarningAction SilentlyContinue

          if (-not $connection.TcpTestSucceeded) {
            Write-Error "Spring Boot failed to start on port 8080."

            Write-Host "===== app-error.log ====="
            Get-Content "$deployDir\app-error.log" `
              -ErrorAction SilentlyContinue

            exit 1
          }

          Write-Host "Spring Boot started successfully on port 8080."